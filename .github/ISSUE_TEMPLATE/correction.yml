name: Correction in a document
description: A sentence that is wrong, unclear, outdated, or contradicts another document.
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a correction in an existing document.
        For a question or an idea about the model, open a **Discussion** instead.
  - type: input
    id: document
    attributes:
      label: Document
      description: The file, and the section if possible.
      placeholder: "Document/Editor on-line - 1 - introduction tree.md, section \"The WvFaceGroup\""
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Which layer does the sentence concern? See CONTRIBUTING.md.
      options:
        - Theoretical model
        - Tispi DOM
        - Not sure
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: The sentence
      description: Quote the sentence as it is written.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Why it is wrong, unclear or outdated. If it contradicts another document, name it.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: The sentence as you would write it. Use the words of the glossary (GLOSSARY.md).
    validations:
      required: true
