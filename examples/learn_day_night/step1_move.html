<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TiSpI — the day / night disc, step 1 — the round trip</title>
<script src="https://cdn.jsdelivr.net/gh/wvanim/TiSpI-DOM@v0.1.1/engine/tispi.min.js"></script>
</head>
<body>
<!-- Step 1 — the round trip
     The Piece goes right in 120 frames, then comes back in 120 frames. At frame 120 it shows the Face "night", then "day" again at 240. No transition, no action yet: the movement is linear and the Faces switch at once. -->
<tsi-pg id="root">
  <!-- tsi-p : tag déclarrant une Piece. Avec une barre de temps -->
                     <!-- data-tsi="script Tispi"  -->
  <tsi-p id="circle" data-tsi="&size; 
    &face    0:day; 120:night;
    &pos     0:0,0; 120:400,0; 240:0,0;">
    <style>@scope { .disc { width: 80px; height: 80px; border-radius: 50%;
                            text-align: center; line-height: 80px; } }</style>
    <tsi-f id="day"   class="disc" style="background-color: gold;">day</tsi-f>
    <tsi-f id="night" class="disc" style="background-color: midnightblue; color: white;">night</tsi-f>
  </tsi-p>
</tsi-pg>
<script>o_.start(null, 100/6, null, null, document.getElementById("root"));</script>
</body>
</html>
